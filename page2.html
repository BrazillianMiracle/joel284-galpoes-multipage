<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goiás Fight // Personais de Luta em Goiânia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { fightDark: '#09090b', fightCard: '#18181b' } } }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col justify-between">
    
    <header class="bg-zinc-950 text-white sticky top-0 z-50 border-b border-zinc-800">
        <div class="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="bg-red-600 text-white p-2 rounded-xl"><i class="fa-solid fa-hand-fist"></i></div>
                <div class="flex flex-col">
                    <span class="text-[10px] font-black tracking-widest text-zinc-400 uppercase leading-none">Anúncios Oficiais</span>
                    <span class="text-sm font-black text-white mt-0.5">GOIÁS FIGHT</span>
                </div>
            </div>
            <a href="https://wa.me/5562999999999" target="_blank" class="bg-red-600 text-white text-[10px] font-black uppercase tracking-widest px-5 py-2.5 rounded-xl hover:bg-red-700 transition-colors">Anunciar Perfil</a>
        </div>
    </header>

    <section class="relative min-h-[30vh] sm:min-h-[40vh] flex items-center justify-center text-center bg-zinc-900 overflow-hidden w-full">
        <div class="absolute inset-0 z-0 w-full h-full">
            <img src="images/hero.jpg" alt="Goias Fight Hero Banner" class="w-full h-full object-cover object-center opacity-45">
        </div>
        <div class="relative z-10 max-w-4xl mx-auto p-4 space-y-2">
            <h1 class="text-3xl sm:text-5xl font-black uppercase text-white tracking-tight drop-shadow-md">ENCONTRE SEU PERSONAL FIGHT</h1>
            <p class="text-xs sm:text-sm text-red-500 font-bold uppercase tracking-widest bg-black/70 inline-block px-4 py-1 rounded-full">Os Melhores Treinadores de Goiânia</p>
        </div>
    </section>

    <main class="max-w-[1600px] mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8 flex-grow w-full">
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-zinc-950 p-6 rounded-2xl border border-zinc-800 space-y-6">
                <div class="flex items-center justify-between border-b pb-4 border-zinc-800">
                    <h2 class="text-xs font-black uppercase text-white tracking-wider">Filtrar Treinadores</h2>
                    <span id="counter-display" class="bg-red-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full">Carregando...</span>
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black uppercase text-zinc-400">Busca por Nome ou Bairro</label>
                    <input type="text" id="search-input" placeholder="Ex: Muay Thai, Setor Bueno..." class="w-full px-3 py-3 rounded-xl border border-zinc-800 text-xs font-bold bg-zinc-900 text-white focus:outline-none focus:border-red-600">
                </div>
                <div class="space-y-2">
                    <label class="block text-[10px] font-black uppercase text-zinc-400">Modalidade Principal</label>
                    <select id="modalidade-filter" class="w-full px-3 py-3 rounded-xl border border-zinc-800 text-xs font-bold bg-zinc-900 text-white focus:outline-none focus:border-red-600">
                        <option value="todas">Todas as Modalidades</option>
                        <option value="Muay Thai">Muay Thai</option>
                        <option value="Boxe">Boxe</option>
                        <option value="Jiu-Jitsu">Jiu-Jitsu</option>
                        <option value="Kickboxing">Kickboxing</option>
                        <option value="MMA">MMA</option>
                        <option value="Defesa Pessoal">Defesa Pessoal</option>
                    </select>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-3 space-y-8">
            <div id="fight-wrapper" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>
            <div class="flex items-center justify-center gap-1.5 flex-wrap py-6 border-t border-zinc-800 pagination-container"></div>
        </section>
    </main>

    <div id="fight-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[9999] flex justify-center items-center opacity-0 pointer-events-none transition-opacity duration-300 p-4"></div>

    <script src="database.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const pathName = window.location.pathname.split("/").pop() || "";
            const pageMatch = pathName.match(/\d+/);
            const currentPage = pageMatch ? parseInt(pageMatch[0], 10) : 1;
            
            if (typeof window.initFightPage === "function") {
                window.initFightPage(currentPage);
            }
        });
    </script>
</body>
</html>
